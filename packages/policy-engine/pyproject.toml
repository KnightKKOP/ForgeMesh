[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemesh-policy-engine"
version = "0.0.1"
description = "ForgeMesh policy engine contract (authorization/admission/quota/approval)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "forgemesh-core",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true