[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemesh-plugin-sdk"
version = "0.0.1"
description = "ForgeMesh plugin SDK contract (PluginManifest, lifecycle, permissions, isolation)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "forgemesh-core",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true