name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的重复触发仅保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} · lint & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging toolchain
        run: python -m pip install -U pip setuptools wheel

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # 使用 --no-deps：子包之间通过本地私有的 forgemesh-* 名称互依赖，
      # 按字母序逐个解析式安装会让 pip 误向 PyPI 查找尚未安装的兄弟包。
      # 外部依赖已在上一部 requirements-dev.txt 中安装，跨包依赖由本循环满足。
      - name: Install packages (editable)
        run: |
          for p in packages/*/; do
            if [ -f "$p/pyproject.toml" ]; then
              echo ">> pip install --no-deps -e $p"
              python -m pip install --no-deps -e "$p"
            fi
          done

      - name: Ruff lint
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

  go:
    name: Go gateway · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: Go format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "ERROR: run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Go test (race detector)
        run: go test -race ./...

  compose-smoke:
    name: Compose · end-to-end smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 构建两个镜像，以 deploy/docker/docker-compose.yaml 叠加 docker-compose.fake-runtime.yaml
      # （加速器清单 + 假启动器）启动，经网关走完推理服务的闭环（创建 → Ready → 流式对话 →
      # 删除 → 重新创建 → 重启后 Degraded、重新部署）。脚本依赖 runner 自带的 curl 与 jq。
      - name: Compose smoke test
        run: scripts/compose_smoke.sh
  architecture-docs:
    name: Architecture docs & schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 校验脚本依赖：PyYAML（YAML 解析）、jsonschema（manifest/schema 实例校验）、
      # pydantic（插件 provider 模块导入冒烟）。
      - name: Install validation dependencies
        run: python -m pip install -U pip pyyaml jsonschema pydantic

      - name: Check architecture docs exist
        run: |
          set -euo pipefail
          arch_dir="docs/architecture"
          if [ ! -d "$arch_dir" ]; then
            echo "ERROR: $arch_dir directory not found"
            exit 1
          fi
          md_count=$(find "$arch_dir" -name '*.md' -type f | wc -l)
          if [ "$md_count" -eq 0 ]; then
            echo "ERROR: no .md files found under $arch_dir"
            exit 1
          fi
          echo "OK: found $md_count architecture .md file(s) under $arch_dir"

      - name: Check ADR files complete
        run: |
          set -euo pipefail
          adr_dir="docs/design-decisions"
          if [ ! -d "$adr_dir" ]; then
            echo "ERROR: $adr_dir directory not found"
            exit 1
          fi
          # 动态校验（不硬编码数量）：
          # 1) 索引 README.md 中提到的 adr-0XX（小写链接形式）逐一存在；
          # 2) 目录内 adr-*.md 文件数 >= 索引数量（新增 ADR 必须同步索引）。
          # grep 无匹配返回 1，加 || true 使其落入下方 -z 检查输出明确错误。
          indexed=$(grep -o 'adr-[0-9]\{3\}' "$adr_dir/README.md" | sort -u || true)
          if [ -z "$indexed" ]; then
            echo "ERROR: no adr-0XX references found in $adr_dir/README.md"
            exit 1
          fi
          indexed_count=$(printf '%s\n' "$indexed" | wc -l | tr -d ' ')
          missing=0
          for adr in $indexed; do
            adr_file="$adr_dir/${adr}.md"
            if [ ! -f "$adr_file" ]; then
              echo "ERROR: missing $adr_file (referenced in README.md)"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing ADR file(s) missing"
            exit 1
          fi
          file_count=$(ls "$adr_dir"/adr-*.md | wc -l | tr -d ' ')
          if [ "$file_count" -lt "$indexed_count" ]; then
            echo "ERROR: $file_count ADR file(s) on disk but $indexed_count referenced in README.md"
            exit 1
          fi
          echo "OK: $file_count ADR file(s) on disk, $indexed_count indexed in README.md"

      - name: Validate OpenAPI spec
        run: |
          set -euo pipefail
          spec="api/openapi/openapi.yaml"
          if [ ! -f "$spec" ]; then
            echo "ERROR: $spec not found"
            exit 1
          fi
          python -c "import yaml; d = yaml.safe_load(open('$spec')); assert d['openapi'].startswith('3.'), 'unsupported OpenAPI version'; print('OK: OpenAPI', d['info']['version'], 'parsed successfully')"

      - name: Validate JSON Schemas
        run: |
          set -euo pipefail
          schema_dir="api/schemas"
          if [ ! -d "$schema_dir" ]; then
            echo "ERROR: $schema_dir directory not found"
            exit 1
          fi
          schema_count=$(find "$schema_dir" -name '*.json' -type f | wc -l)
          if [ "$schema_count" -eq 0 ]; then
            echo "ERROR: no .json schema files found under $schema_dir"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          schema_dir = pathlib.Path('$schema_dir')
          errors = 0
          files = sorted(schema_dir.glob('*.json'))
          for f in files:
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  print(f'ERROR: {f}: {e}', file=sys.stderr)
                  errors += 1
          if errors:
              sys.exit(1)
          print(f'OK: {len(files)} JSON Schema(s) parsed successfully')
          "
      # 以下为 WP-A2 CI 补强：复杂校验逻辑一律收敛到 scripts/*.py，
      # CI 仅调用脚本（避免内嵌 python 与 shell 变量互相插值导致 NameError）。
      - name: Validate manifests against schema
        run: python scripts/validate_manifests.py

      - name: OpenAPI semantic check
        run: python scripts/openapi_semantic_check.py

      - name: Metadata consistency
        run: python scripts/check_metadata_consistency.py

      - name: Plugin entrypoint smoke
        run: python scripts/plugin_entrypoint_smoke.py
