apiVersion: forgemesh.io/v1alpha1
kind: PluginManifest
metadata:
  id: forgemesh.workflow.temporal
  version: 0.0.1
spec:
  # schema plugin-manifest.schema.json 的 category 枚举不含 "workflow"；
  # 同类工作流插件 workflow-reference 亦为 provider，故对齐为 provider。
  category: provider
  compatibility:
    coreApi: v1alpha1
    minCoreVersion: "0.1.0"
  provides:
    - workflow.runtime
    - workflow.temporal
    - workflow.compensation
    - workflow.approval
  requires:
    - resource.registry
    - event.stream
  permissions:
    - resource.read
    - workflow.execute
  isolation: restricted-rpc
  entrypoint: "python -m forgemesh_workflow_temporal"
  healthCheck:
    mode: rpc
    timeoutMs: 2000

