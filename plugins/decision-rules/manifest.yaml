apiVersion: forgemesh.io/v1alpha1
kind: PluginManifest
metadata:
  id: forgemesh.decision.rules
  version: 0.0.1
spec:
  category: provider
  compatibility:
    coreApi: v1alpha1
    minCoreVersion: "0.1.0"
  provides:
    - decision.provider.rules
  requires:
    - decision.routing
    - resource.registry
  permissions:
    - resource.read
    - decision.evaluate
  isolation: restricted-rpc
  entrypoint: "provider:RulesProvider"
  healthCheck:
    mode: rpc
    timeoutMs: 2000
