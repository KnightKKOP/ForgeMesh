openapi: 3.1.0
info:
  title: ForgeMesh Control Plane API
  version: 1.1.0
  description: >-
    ForgeMesh 控制平面对外 API，当前为预览版（x-stability: beta）。外部入口统一经 Go 网关
    （/api/v1/ 版本前缀）；本文件描述控制平面资源/运行 API 与探针。
    统一响应信封与错误码见 components。资源权威 Schema 见 api/schemas/。
    beta 阶段的 minor 版本可能包含破坏性变更，均在 CHANGELOG 中以「破坏性」标注；
    x-stability 改为 stable 之后，按 docs/governance/deprecation-policy.md 保证 major 版本内兼容。
    认证（ADR-014）：除探针外的全部端点要求 Authorization: Bearer <API key>，
    租户取自 key 绑定的租户；X-Tenant-Id 请求头可以省略，携带时必须与之一致，
    否则返回 403。读接口要求 read scope，写接口要求 write scope。
  x-stability: beta
  x-deprecation-policy: >-
    端点或字段弃用时使用 x-deprecated: true 扩展字段标记，并附带 x-deprecated-since
    记录弃用版本、x-deprecated-removal 记录计划移除版本。弃用端点至少保留 2 个
    minor 版本（见 docs/releases/v1.0.md 弃用政策章节）。
servers:
  - url: http://localhost:8080
    description: 本地控制平面（Go 网关前置）
security:
  - apiKey: []
tags:
  - name: inference-services
    description: 推理服务声明式生命周期管理（创建/查询/删除）
  - name: workflows
    description: 工作流运行启动与状态查询
  - name: decisions
    description: 结构化决策请求（决策≠授权；授权由 Scheduler/Policy 完成）
  - name: probes
    description: 存活与就绪探针

paths:
  /healthz:
    get:
      tags: [probes]
      summary: 存活探针
      operationId: healthz
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [probes]
      summary: 就绪探针
      operationId: readyz
      security: []
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/inference-services:
    get:
      tags: [inference-services]
      summary: 列出推理服务
      operationId: listInferenceServices
      parameters:
        - name: tenantId
          in: query
          deprecated: true
          x-deprecated: true
          x-deprecated-since: 1.1.0
          x-deprecated-removal: 1.3.0
          description: 从未生效，服务端忽略；租户取自凭证（ADR-014）。
          schema:
            type: string
        - name: namespace
          in: query
          description: 只列出该命名空间中的资源；省略时不按命名空间过滤。
          schema:
            type: string
        - name: limit
          in: query
          description: 单页最多返回的条数；超出 1–1000 返回 400。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceServiceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [inference-services]
      summary: 创建推理服务（声明式）
      operationId: createInferenceService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferenceService"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


  /api/v1/inference-services/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: query
        description: 资源所在的命名空间；省略时指不带命名空间的资源。
        schema:
          type: string
    get:
      tags: [inference-services]
      summary: 获取推理服务
      operationId: getInferenceService
      responses:
        "200":
          description: 资源
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceService"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [inference-services]
      summary: 删除推理服务（受控删除：finalizer 驱动受控释放）
      operationId: deleteInferenceService
      responses:
        "202":
          description: >
            已受理删除（异步）——资源持有 finalizer（有外部副作用或持有加速器
            分配时自动追加），置为 Terminating，由协调器驱动「取消部署、停止推理实例 →
            清空 finalizer → 释放分配 → 物理删除」闭环（development-plan 第 7 章）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminatingResponse"
        "204":
          description: 已直接删除（无 finalizer，无外部副作用，没有加速器分配）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


  /api/v1/workflows:
    post:
      tags: [workflows]
      summary: 启动工作流运行
      operationId: startWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRunRequest"
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/v1/decisions:
    post:
      tags: [decisions]
      summary: 请求一次结构化决策（决策≠授权；授权由 Scheduler/Policy 完成）
      operationId: requestDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: 决策结果（含可查询的决策追踪）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        绑定租户与 scope（read / write / *）的 API key（ADR-014），由
        python -m forgemesh.controlplane.keygen 生成；服务端只保存其 SHA-256 摘要。
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        component:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 机器可读错误码，如 CONFLICT / NOT_FOUND。
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            correlationId:
              type: string
    InferenceService:
      type: object
      description: "权威 Schema: api/schemas/inference-service.schema.json（此处为骨架摘要）。"
      additionalProperties: true
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          type: object
          additionalProperties: true
        spec:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/InferenceServiceStatus"
    InferenceServiceStatus:
      type: object
      description: 实际状态，只由控制器写入；创建请求中的 status 会被忽略。
      additionalProperties: true
      properties:
        phase:
          type: string
        observedGeneration:
          type: integer
          minimum: 0
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        endpoints:
          type: array
          description: 实例访问地址；网关只向 ready 的实例转发推理请求。
          items:
            $ref: "#/components/schemas/Endpoint"
    Endpoint:
      type: object
      required: [url, protocol]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: 实例基地址（http / https，不带凭证、查询串与片段），如 http://10.0.0.1:8000。
        ready:
          type: boolean
          default: true
        instanceId:
          type: [string, "null"]
        protocol:
          type: string
          enum: [openai-chat, tgi-generate]
          description: >-
            决定网关把推理请求转发到实例的哪个路径：openai-chat 为 POST /v1/chat/completions，
            tgi-generate 为 POST /generate_stream。
    InferenceServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InferenceService"
        nextPageToken:
          type: string
    TerminatingResponse:
      type: object
      description: >
        受控删除受理响应：资源持有 finalizer（有外部副作用或持有加速器分配时
        自动追加默认 finalizer），已置为 Terminating，等待协调器完成受控释放后
        物理删除。
      required: [name, phase]
      properties:
        name:
          type: string
          description: 资源名
        phase:
          type: string
          enum: [Terminating]
          description: 受理后的生命周期阶段（固定 Terminating）
    WorkflowRunRequest:
      type: object
      required: [definition, version]
      properties:
        definition:
          type: string
          description: WorkflowDefinition 名称
        version:
          type: integer
          description: 定义版本（不可变）。
        inputs:
          type: object
          additionalProperties: true
    WorkflowRun:
      type: object
      required: [runId, state]
      properties:
        runId:
          type: string
        state:
          type: string
          enum: [Pending, Running, Waiting, Succeeded, Failed, Cancelled, TimedOut, Compensating]
        definitionVersion:
          type: integer
    DecisionRequest:
      type: object
      required: [question, context]
      properties:
        question:
          type: string
        context:
          type: object
          additionalProperties: true
        requiredCapabilities:
          type: array
          items:
            type: string
    DecisionResponse:
      type: object
      required: [decisionId, outcome, rationale]
      properties:
        decisionId:
          type: string
          description: 决策可查询（审计）。
        outcome:
          type: string
        rationale:
          type: string
        trace:
          type: object
          additionalProperties: true
        degraded:
          type: boolean
          description: 是否走了 Provider 降级路径。
  responses:
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 缺少凭证或凭证无效（错误码 UNAUTHENTICATED）
      headers:
        WWW-Authenticate:
          description: 固定为 Bearer realm="forgemesh"。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        凭证有效但无权执行（错误码 FORBIDDEN）：缺少所需 scope，或
        X-Tenant-Id 与凭证绑定的租户不一致。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 并发冲突/已存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >-
        所依赖的组件未就绪（错误码 AUTHENTICATOR_UNAVAILABLE、REGISTRY_UNAVAILABLE 等）：
        控制平面未完成组装或正在关闭，不会以临时内存库或放行兜底。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

