[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemesh-node-agent"
version = "0.0.1"
description = "ForgeMesh node agent (typed tasks only, idempotency, reconnect recovery)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "forgemesh-core",
    "forgemesh-resource-model",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true