[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemesh-cli"
version = "0.0.1"
description = "ForgeMesh command line client of the REST API (apply/get/describe/list/delete/wait)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.1",
]

[project.scripts]
forgemesh = "forgemesh.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
