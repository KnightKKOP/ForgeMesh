[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemesh-workflow-runtime"
version = "0.0.1"
description = "ForgeMesh workflow runtime: persistent execution engine with DSL, compensation and approval"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "forgemesh-core",
    "forgemesh-workflow-api",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true