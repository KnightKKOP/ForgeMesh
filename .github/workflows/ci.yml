name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的重复触发仅保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} · lint & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging toolchain
        run: python -m pip install -U pip setuptools wheel

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # 使用 --no-deps：子包之间通过本地私有的 forgemesh-* 名称互依赖，
      # 按字母序逐个解析式安装会让 pip 误向 PyPI 查找尚未安装的兄弟包。
      # 外部依赖已在上一部 requirements-dev.txt 中安装，跨包依赖由本循环满足。
      - name: Install packages (editable)
        run: |
          for p in packages/*/; do
            if [ -f "$p/pyproject.toml" ]; then
              echo ">> pip install --no-deps -e $p"
              python -m pip install --no-deps -e "$p"
            fi
          done

      - name: Ruff lint
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

  go:
    name: Go gateway · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: gateway/go.sum

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./...
  architecture-docs:
    name: Architecture docs & schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyYAML
        run: python -m pip install -U pip pyyaml

      - name: Check architecture docs exist
        run: |
          set -euo pipefail
          arch_dir="docs/architecture"
          if [ ! -d "$arch_dir" ]; then
            echo "ERROR: $arch_dir directory not found"
            exit 1
          fi
          md_count=$(find "$arch_dir" -name '*.md' -type f | wc -l)
          if [ "$md_count" -eq 0 ]; then
            echo "ERROR: no .md files found under $arch_dir"
            exit 1
          fi
          echo "OK: found $md_count architecture .md file(s) under $arch_dir"

      - name: Check ADR files complete
        run: |
          set -euo pipefail
          adr_dir="docs/design-decisions"
          if [ ! -d "$adr_dir" ]; then
            echo "ERROR: $adr_dir directory not found"
            exit 1
          fi
          # ADR-001 ~ ADR-012 expected
          missing=0
          for i in $(seq -w 1 12); do
            adr_file="$adr_dir/adr-0${i}.md"
            if [ ! -f "$adr_file" ]; then
              echo "ERROR: missing $adr_file"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing ADR file(s) missing"
            exit 1
          fi
          adr_count=$(find "$adr_dir" -name 'adr-*.md' -type f | wc -l)
          echo "OK: found $adr_count ADR file(s) under $adr_dir"

      - name: Validate OpenAPI spec
        run: |
          set -euo pipefail
          spec="api/openapi/openapi.yaml"
          if [ ! -f "$spec" ]; then
            echo "ERROR: $spec not found"
            exit 1
          fi
          python -c "import yaml; d = yaml.safe_load(open('$spec')); assert d['openapi'].startswith('3.'), 'unsupported OpenAPI version'; print('OK: OpenAPI', d['info']['version'], 'parsed successfully')"

      - name: Validate JSON Schemas
        run: |
          set -euo pipefail
          schema_dir="api/schemas"
          if [ ! -d "$schema_dir" ]; then
            echo "ERROR: $schema_dir directory not found"
            exit 1
          fi
          schema_count=$(find "$schema_dir" -name '*.json' -type f | wc -l)
          if [ "$schema_count" -eq 0 ]; then
            echo "ERROR: no .json schema files found under $schema_dir"
            exit 1
          fi
          python -c "
          import json, pathlib, sys
          schema_dir = pathlib.Path('$schema_dir')
          errors = 0
          for f in sorted(schema_dir.glob('*.json')):
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  print(f'ERROR: {f}: {e}', file=sys.stderr)
                  errors += 1
          if errors:
              sys.exit(1)
          print(f'OK: {schema_count} JSON Schema(s) parsed successfully')
          "
