apiVersion: forgemesh.io/v1alpha1
kind: PluginManifest
metadata:
  id: forgemesh.workflow.temporal
  version: 0.0.1
spec:
  category: workflow
  compatibility:
    coreApi: v1alpha1
    minCoreVersion: "0.1.0"
  provides:
    - workflow.runtime
    - workflow.temporal
    - workflow.compensation
    - workflow.approval
  requires:
    - resource.registry
    - event.stream
  permissions:
    - resource.read
    - workflow.execute
  isolation: restricted-rpc
  entrypoint: "python -m forgemesh_workflow_temporal"
  healthCheck:
    mode: rpc
    timeoutMs: 2000
  capabilities:
    - temporal
    - compensation
    - approval
