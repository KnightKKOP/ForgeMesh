# ForgeMesh 根级工具配置
#
# 重要：本文件【不包含打包配置】。ForgeMesh 采用 monorepo + 命名空间包（PEP 420）
# 结构，每个子包自带 pyproject.toml（见 README「统一子包模板」与 CONTRIBUTING）。
# 本文件仅统一 ruff / pytest / coverage 等开发工具的行为。

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "build", "dist", "gateway"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# 团队统一：项目需兼容 Python 3.9，统一使用 typing.Optional/List/Dict，
# 因此忽略要求改用 PEP585/PEP604（内置泛型 / X|Y）语法的 UP 规则。
# UP006=非 PEP585 注解, UP035=弃用 typing 导入, UP037=注解引号, UP045=非 PEP604 Optional, UP007=非 PEP604 Union
ignore = ["E501", "B008", "UP006", "UP035", "UP037", "UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: 单元测试（每次 PR）",
    "contract: 契约测试（每次 PR）",
    "integration: 集成测试（每日）",
    "e2e: 端到端测试（每阶段/每夜）",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]