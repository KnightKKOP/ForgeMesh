# ForgeMesh 根级工具配置
#
# 重要：本文件【不包含打包配置】。ForgeMesh 采用 monorepo + 命名空间包（PEP 420）
# 结构，每个子包自带 pyproject.toml（见 README「统一子包模板」与 CONTRIBUTING）。
# 本文件仅统一 ruff / pytest / coverage 等开发工具的行为。

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "gateway"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Python 3.12+：原生支持 PEP 585（内置泛型）与 PEP 604（X|Y），无需忽略 UP 规则。
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: 单元测试（每次 PR）",
    "contract: 契约测试（每次 PR）",
    "integration: 集成测试（每日）",
    "e2e: 端到端测试（每阶段/每夜）",
    "performance: 性能基准测试（每次 PR，宽松阈值）",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]