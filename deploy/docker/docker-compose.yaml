# ForgeMesh 本地拓扑：control-plane（Python 控制平面，SQLite 权威存储）+ gateway（Go 网关，外部入口）。
#
# 在仓库根目录执行：
#   1. 生成 API key，把 key 文件写到 deploy/docker/api-keys.json（格式见根目录 README「运行控制平面」）。
#      文件只含 key 的 SHA-256 摘要，必须对容器用户可读（例如权限 0644）。
#   2. docker compose -f deploy/docker/docker-compose.yaml up --build
#   3. curl -H "Authorization: Bearer <key>" http://127.0.0.1:8081/api/v1/inference-services
#
# 两个服务都只发布在 127.0.0.1；需要从其他机器访问网关时修改 gateway 的 ports。
# ADR-013：权威存储为 SQLite，只允许一个控制平面实例写同一个库，control-plane 不得扩展副本。

services:
  control-plane:
    image: forgemesh/control-plane:0.0.1
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    environment:
      FORGEMESH_API_KEYS_FILE: /run/secrets/api-keys
    secrets:
      - api-keys
    volumes:
      - control-plane-data:/var/lib/forgemesh
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: forgemesh/gateway:0.0.1
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    environment:
      GATEWAY_UPSTREAM_URL: http://control-plane:8080
      GATEWAY_API_KEYS_FILE: /run/secrets/api-keys
    secrets:
      - api-keys
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      control-plane:
        condition: service_healthy

  # PostgreSQL 是目标态权威存储（ADR-013），控制平面尚未使用；只在 --profile postgres 时启动。
  postgres:
    profiles: ["postgres"]
    image: postgres:15
    environment:
      POSTGRES_USER: forgemesh
      POSTGRES_PASSWORD: forgemesh
      POSTGRES_DB: forgemesh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgemesh"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  api-keys:
    file: ./api-keys.json

volumes:
  control-plane-data:
  pgdata:
