apiVersion: forgemesh.io/v1alpha1
kind: PluginManifest
metadata:
  id: forgemesh.gpu.nvidia
  version: 0.0.1
spec:
  category: hardware
  compatibility:
    coreApi: v1alpha1
    minCoreVersion: "0.1.0"
  provides:
    - device.probe.nvidia
    - device.partition.nvidia.mig
    - device.topology.nvidia
  requires:
    - device.registry
  permissions:
    - device.read
    - device.partition
  isolation: in-process
  entrypoint: "discovery:GPUDiscoverer"
  healthCheck:
    mode: rpc
    timeoutMs: 2000
