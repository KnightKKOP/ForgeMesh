# ForgeMesh PluginManifest 示例（vLLM 运行时）
# 契约：api/schemas/plugin-manifest.schema.json
# 对齐 docs/architecture/development-plan.md 6.3 与 architecture 8.2。
apiVersion: forgemesh.io/v1alpha1
kind: PluginManifest
metadata:
  id: forgemesh.runtime.vllm
  version: 1.0.0
spec:
  category: runtime
  compatibility:
    coreApi: "v1alpha1"
    minCoreVersion: "0.1.0"
  provides:
    - inference.runtime
    - inference.healthcheck
  requires:
    - resource.registry
  permissions:
    - resource.read
    - inference.deploy
    - inference.inspect
  isolation: restricted-rpc        # 按信任级别隔离（ADR-006）
  entrypoint: "python -m forgemesh_runtime_vllm"
  artifactDigest: sha256:ab12...
  signature: cosign:...
  configuration:
    schema: ./config.schema.json
  healthCheck:
    mode: rpc
    timeoutMs: 2000
