[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemesh-control-plane"
version = "0.0.1"
description = "ForgeMesh control plane: SQLite-backed registry, reconciler, policy, plugin manager, outbox, audit and REST API"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "forgemesh-core",
    "forgemesh-resource-model",
    "forgemesh-workflow-api",
    "forgemesh-decision-api",
    "forgemesh-policy-engine",
    "forgemesh-plugin-sdk",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
forgemesh-control-plane = "forgemesh.controlplane.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true