apiVersion: forgemesh.io/v1alpha1
kind: PluginManifest
metadata:
  id: forgemesh.metering.basic
  version: 0.0.1
spec:
  category: observability
  compatibility:
    coreApi: v1alpha1
    minCoreVersion: "0.1.0"
  provides:
    - metering.tokens
    - metrics.export
  requires:
    - event.stream
  permissions:
    - metering.read
    - event.subscribe
  isolation: restricted-rpc
  entrypoint: "python -m forgemesh_metering_basic"
  healthCheck:
    mode: rpc
    timeoutMs: 2000
