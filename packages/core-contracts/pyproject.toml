[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "forgemesh-core"
version = "0.0.1"
description = "ForgeMesh core contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true