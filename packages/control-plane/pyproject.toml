[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemesh-control-plane"
version = "0.0.1"
description = "ForgeMesh control plane HTTP service skeleton (contract placeholder, no DB in phase 0)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "forgemesh-core",
    "forgemesh-workflow-api",
    "forgemesh-decision-api",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true