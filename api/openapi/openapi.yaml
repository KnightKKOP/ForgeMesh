openapi: 3.1.0
info:
  title: ForgeMesh Control Plane API
  version: 1.1.0
  description: >-
    ForgeMesh 控制平面对外 API，当前为预览版（x-stability: beta）。外部入口统一经 Go 网关
    （/api/v1/ 版本前缀）；本文件描述控制平面资源/运行 API 与探针。
    统一响应信封与错误码见 components。资源权威 Schema 见 api/schemas/。
    beta 阶段的 minor 版本可能包含破坏性变更，均在 CHANGELOG 中以「破坏性」标注；
    x-stability 改为 stable 之后，按 docs/governance/deprecation-policy.md 保证 major 版本内兼容。
    认证（ADR-014）：除探针外的全部端点要求 Authorization: Bearer <API key>，
    租户取自 key 绑定的租户；X-Tenant-Id 请求头可以省略，携带时必须与之一致，
    否则返回 403。读接口要求 read scope，写接口要求 write scope。
  x-stability: beta
  x-deprecation-policy: >-
    端点或字段弃用时使用 x-deprecated: true 扩展字段标记，并附带 x-deprecated-since
    记录弃用版本、x-deprecated-removal 记录计划移除版本。弃用端点至少保留 2 个
    minor 版本（见 docs/releases/v1.0.md 弃用政策章节）。
servers:
  - url: http://localhost:8080
    description: 本地控制平面（Go 网关前置）
security:
  - apiKey: []
tags:
  - name: inference-services
    description: 推理服务声明式生命周期管理（创建/查询/更新/删除）
  - name: workflows
    description: 工作流运行启动与状态查询
  - name: decisions
    description: 结构化决策请求（决策≠授权；授权由 Scheduler/Policy 完成）
  - name: resources
    description: 按 kind 列出资源（只读）
  - name: probes
    description: 存活与就绪探针

paths:
  /healthz:
    get:
      tags: [probes]
      summary: 存活探针
      operationId: healthz
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      tags: [probes]
      summary: 就绪探针
      operationId: readyz
      security: []
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/inference-services:
    get:
      tags: [inference-services]
      summary: 列出推理服务
      operationId: listInferenceServices
      description: >-
        按 (namespace, name) 升序分页，不带命名空间的资源排在最前。响应带 nextPageToken 时
        还有下一页：以相同的过滤条件把它作为 pageToken 传回。
      parameters:
        - name: tenantId
          in: query
          deprecated: true
          x-deprecated: true
          x-deprecated-since: 1.1.0
          x-deprecated-removal: 1.3.0
          description: 从未生效，服务端忽略；租户取自凭证（ADR-014）。
          schema:
            type: string
        - $ref: "#/components/parameters/NamespaceFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: 一页推理服务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceServiceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [inference-services]
      summary: 创建推理服务（声明式）
      operationId: createInferenceService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferenceService"
      responses:
        "201":
          description: 已创建（generation 为 1，observedGeneration 为 0）
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


  /api/v1/inference-services/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: namespace
        in: query
        description: 资源所在的命名空间；省略时指不带命名空间的资源。
        schema:
          type: string
    get:
      tags: [inference-services]
      summary: 获取推理服务
      operationId: getInferenceService
      responses:
        "200":
          description: 资源
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceService"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [inference-services]
      summary: 整体替换推理服务的 spec / labels / annotations
      operationId: replaceInferenceService
      description: >-
        请求体是完整的资源文档（GET 的响应修改后可直接提交）。spec、metadata.labels 与
        metadata.annotations 整体替换（省略 labels / annotations 即清空）；只有 spec 变化时
        generation 递增，labels / annotations 变化不递增，没有任何变化时不写入、版本不变。
        kind、apiVersion、metadata.name、metadata.namespace 与租户不可修改：给出时必须与当前
        资源一致，否则 400。status、conditions、finalizers、generation、observedGeneration
        被忽略。metadata.uid / metadata.resourceVersion 给出时是前置条件，与 If-Match 一样，
        不满足时返回 409；处于 Terminating 的资源拒绝更新（409）。
        已经 Ready 的服务在 spec 变化后保持 generation 大于 observedGeneration，直到控制器
        处理新的 spec。
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferenceService"
      responses:
        "200":
          description: 更新后的资源（没有变化时为当前资源）
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [inference-services]
      summary: 以 JSON Merge Patch（RFC 7386）更新推理服务
      operationId: patchInferenceService
      description: >-
        补丁合并到当前资源的 JSON 表示（与 GET 的响应相同）之后，按与 PUT 相同的规则检查并
        写入：null 删除字段，对象逐字段合并，数组整体替换。补丁中没有给出的字段沿用当前值，
        所以只有补丁里给出的 metadata.resourceVersion / metadata.uid 才构成前置条件。
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/InferenceServicePatch"
      responses:
        "200":
          description: 更新后的资源（没有变化时为当前资源）
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [inference-services]
      summary: 删除推理服务（受控删除：finalizer 驱动受控释放）
      operationId: deleteInferenceService
      responses:
        "202":
          description: >
            已受理删除（异步）——资源持有 finalizer（有外部副作用或持有加速器
            分配时自动追加），置为 Terminating，由协调器驱动「取消部署、停止推理实例 →
            清空 finalizer → 释放分配 → 物理删除」闭环（development-plan 第 7 章）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminatingResponse"
        "204":
          description: 已直接删除（无 finalizer，无外部副作用，没有加速器分配）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


  /api/v1/workflows:
    post:
      tags: [workflows]
      summary: 启动工作流运行
      operationId: startWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRunRequest"
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/v1/decisions:
    post:
      tags: [decisions]
      summary: 请求一次结构化决策（决策≠授权；授权由 Scheduler/Policy 完成）
      operationId: requestDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: 决策结果（含可查询的决策追踪）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/v1/resources:
    get:
      tags: [resources]
      summary: 按 kind 列出资源
      operationId: listResources
      description: >-
        与推理服务列表相同的排序与分页规则；省略 kind 时返回空列表（不做全表扫描），这时不会
        签发 nextPageToken，带 pageToken 返回 400。
      parameters:
        - name: kind
          in: query
          description: 资源类型，如 InferenceService。
          schema:
            type: string
        - $ref: "#/components/parameters/NamespaceFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: 一页资源
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"


components:
  parameters:
    NamespaceFilter:
      name: namespace
      in: query
      description: 只列出该命名空间中的资源；省略时不按命名空间过滤。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 单页最多返回的条数；超出 1–1000 返回 400。
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    PageToken:
      name: pageToken
      in: query
      description: >-
        上一页响应中的 nextPageToken（不透明字符串），空字符串等同于省略。只对签发它的租户与
        同一组过滤条件（namespace；资源列表还有 kind）有效，limit 可以逐页变化；格式不对、
        被修改或用于其他租户 / 过滤条件时返回 400。控制平面重启后仍然有效。
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        乐观并发前置条件：取自资源响应的 ETag（强比较，弱标签永不匹配；* 表示资源存在即可）。
        与当前 ETag 不匹配返回 409（details.reason 为 ResourceVersionMismatch）。
      schema:
        type: string
  headers:
    ETag:
      description: >-
        资源当前版本的强实体标签（不透明字符串，可原样用于 If-Match）：resourceVersion 变化时
        随之变化，同名资源删除后重建也不会得到旧的 ETag。
      schema:
        type: string
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        绑定租户与 scope（read / write / *）的 API key（ADR-014），由
        python -m forgemesh.controlplane.keygen 生成；服务端只保存其 SHA-256 摘要。
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        component:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 机器可读错误码，如 CONFLICT / NOT_FOUND。
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            correlationId:
              type: string
    InferenceService:
      type: object
      description: >-
        权威 Schema: api/schemas/inference-service.schema.json（此处为 API 表示的摘要）。
        status、conditions、finalizers 由控制平面维护，请求中的值被忽略；未知的顶层字段返回 400。
      additionalProperties: false
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        spec:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/InferenceServiceStatus"
        conditions:
          type: array
          readOnly: true
          items:
            type: object
            additionalProperties: true
        finalizers:
          type: array
          readOnly: true
          description: 受控删除的阻塞器，由控制平面维护。
          items:
            type: string
    InferenceServicePatch:
      type: object
      description: >-
        JSON Merge Patch 文档（RFC 7386）：合并到当前资源的 JSON 表示之后，结果须满足
        InferenceService 与 PUT 的规则。
      additionalProperties: true
    ObjectMeta:
      type: object
      description: >-
        公共元数据。uid、tenantId、resourceVersion、generation、observedGeneration
        由服务端维护（readOnly），创建请求中的值被忽略。
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        namespace:
          type: [string, "null"]
          description: 租户内的逻辑命名空间；null 表示不带命名空间的资源。
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        uid:
          type: [string, "null"]
          readOnly: true
          description: 服务端分配的稳定标识，资源生命周期内不变。
        tenantId:
          type: [string, "null"]
          readOnly: true
          description: 凭证绑定的租户。
        resourceVersion:
          type: [string, "null"]
          readOnly: true
          description: 乐观并发版本（不透明字符串），每次成功写入（含控制器写 status）都会变化。
        generation:
          type: integer
          minimum: 0
          readOnly: true
          description: >-
            期望状态（spec）版本：创建时为 1，只有 spec 变化时递增，labels / annotations
            变化不递增。1.1.0 之前创建的资源保留原值（通常为 0），下一次 spec 变化时从原值递增。
        observedGeneration:
          type: integer
          minimum: 0
          readOnly: true
          description: 控制器已处理到的 generation；小于 generation 表示最新的 spec 尚未被处理。
    InferenceServiceStatus:
      type: object
      description: 实际状态，只由控制器写入；创建请求中的 status 会被忽略。
      additionalProperties: true
      properties:
        phase:
          type: string
        observedGeneration:
          type: integer
          minimum: 0
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        endpoints:
          type: array
          description: 实例访问地址；网关只向 ready 的实例转发推理请求。
          items:
            $ref: "#/components/schemas/Endpoint"
    Endpoint:
      type: object
      required: [url, protocol]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: 实例基地址（http / https，不带凭证、查询串与片段），如 http://10.0.0.1:8000。
        ready:
          type: boolean
          default: true
        instanceId:
          type: [string, "null"]
        protocol:
          type: string
          enum: [openai-chat, tgi-generate]
          description: >-
            决定网关把推理请求转发到实例的哪个路径：openai-chat 为 POST /v1/chat/completions，
            tgi-generate 为 POST /generate_stream。
    InferenceServiceList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InferenceService"
        count:
          $ref: "#/components/schemas/PageCount"
        nextPageToken:
          $ref: "#/components/schemas/NextPageToken"
    Resource:
      type: object
      description: >-
        通用资源表示：apiVersion、kind、metadata，加上该 kind 特有的字段（如 InferenceService
        的 spec / status，见 InferenceService）。
      required: [apiVersion, kind, metadata]
      additionalProperties: true
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: "#/components/schemas/ObjectMeta"
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        finalizers:
          type: array
          items:
            type: string
    ResourceList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        count:
          $ref: "#/components/schemas/PageCount"
        nextPageToken:
          $ref: "#/components/schemas/NextPageToken"
    PageCount:
      type: integer
      minimum: 0
      description: 本页的条数（不是总数）。
    NextPageToken:
      type: string
      description: >-
        还有更多结果时出现，最后一页不带此字段：作为 pageToken 传回即得下一页。游标记录位置而
        不是快照，翻页期间新建或删除的资源可能出现也可能缺席，全程存在的资源恰好出现一次。
    TerminatingResponse:
      type: object
      description: >
        受控删除受理响应：资源持有 finalizer（有外部副作用或持有加速器分配时
        自动追加默认 finalizer），已置为 Terminating，等待协调器完成受控释放后
        物理删除。
      required: [name, phase]
      properties:
        name:
          type: string
          description: 资源名
        phase:
          type: string
          enum: [Terminating]
          description: 受理后的生命周期阶段（固定 Terminating）
    WorkflowRunRequest:
      type: object
      required: [definition, version]
      properties:
        definition:
          type: string
          description: WorkflowDefinition 名称
        version:
          type: integer
          description: 定义版本（不可变）。
        inputs:
          type: object
          additionalProperties: true
    WorkflowRun:
      type: object
      required: [runId, state]
      properties:
        runId:
          type: string
        state:
          type: string
          enum: [Pending, Running, Waiting, Succeeded, Failed, Cancelled, TimedOut, Compensating]
        definitionVersion:
          type: integer
    DecisionRequest:
      type: object
      required: [question, context]
      properties:
        question:
          type: string
        context:
          type: object
          additionalProperties: true
        requiredCapabilities:
          type: array
          items:
            type: string
    DecisionResponse:
      type: object
      required: [decisionId, outcome, rationale]
      properties:
        decisionId:
          type: string
          description: 决策可查询（审计）。
        outcome:
          type: string
        rationale:
          type: string
        trace:
          type: object
          additionalProperties: true
        degraded:
          type: boolean
          description: 是否走了 Provider 降级路径。
  responses:
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 缺少凭证或凭证无效（错误码 UNAUTHENTICATED）
      headers:
        WWW-Authenticate:
          description: 固定为 Bearer realm="forgemesh"。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        凭证有效但无权执行（错误码 FORBIDDEN）：缺少所需 scope，或
        X-Tenant-Id 与凭证绑定的租户不一致。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        冲突（错误码 CONFLICT）：同名资源已存在，或写入被拒绝。更新被拒绝时 details.reason
        说明原因：ResourceVersionMismatch（resourceVersion 或 If-Match 与当前版本不符，重新
        读取后重试）、UidMismatch（同名资源已被删除并重建）、Terminating（资源正在删除，不再
        接受更新）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: 请求体的媒体类型不受支持（错误码 UNSUPPORTED_MEDIA_TYPE）。
      headers:
        Accept-Patch:
          description: PATCH 接受的媒体类型，固定为 application/merge-patch+json。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >-
        所依赖的组件未就绪（错误码 AUTHENTICATOR_UNAVAILABLE、REGISTRY_UNAVAILABLE 等）：
        控制平面未完成组装或正在关闭，不会以临时内存库或放行兜底。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

